[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-caribe"
version = "0.1.0"
description = "Lightweight XDR prototype for security event ingestion and triage"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "httpx>=0.27,<1.0",
]

[project.scripts]
guardian-restore-sqlite = "guardian_caribe.restore_sqlite_backup:main"

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0", "ruff>=0.7,<1.0"]
security = ["bandit>=1.8,<2.0", "pip-audit>=2.7,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

